# Trusted binaries from this public repository's Releases only.
# Payload, trust boundary and private-CI alternative: docs/NATIVE-CHECKERS.md
name: native-suite

on:
  repository_dispatch:
    types: [checker-binary]
  workflow_dispatch:
    inputs:
      implementation:
        description: "公开报告中的实现名"
        default: "checker"
      release_tag:
        description: "本仓已发布 Release 的准确 tag"
        required: true
      asset_name:
        description: "Release 中的准确文件名"
        required: true
      source_sha:
        description: "可公开的源码提交 SHA（可选）"
      sha256:
        description: "二进制 SHA-256（64 位十六进制，可选）"
      baseline:
        description: "tsc 参考配置与对应测试集"
        type: choice
        options: ["7.1.0-beta", "6.0.3", "5.9.3"]
        default: "7.1.0-beta"
      mode:
        description: "fixed（默认）或 official；checker-batch 均不可作兼容性结论"
        type: choice
        options: ["fixed", "official"]
        default: "fixed"
      limit:
        description: "只跑前 N 个源用例（0 = 该参考配置的默认冒烟集全部）"
        default: "0"

permissions: {}
defaults:
  run:
    shell: bash

jobs:
  retrieve:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.resolve.outputs.plan }}
      corpus_ref: ${{ steps.resolve.outputs.corpus_ref }}
    steps:
      # Actions expression equality ignores case; Git branch names do not.
      - name: Require the exact default branch ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'native-suite must run from the exact default branch ref' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          no-cache: true
          token: ""

      - name: Resolve exact Release asset and verify bytes (no execution)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/native-suite.ts resolve

  suite:
    needs: retrieve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # Both checkouts are public. Fetch the workflow commit and pinned corpus
      # without passing a GitHub token to Git or writing one to disk.
      - name: Check out workflow commit and corpus
        env:
          CORPUS_REF: ${{ needs.retrieve.outputs.corpus_ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init --quiet
          git -c credential.helper= fetch --quiet --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          git init --quiet reference/corpus
          git -C reference/corpus -c credential.helper= fetch --quiet --depth=1 --no-tags https://github.com/microsoft/TypeScript.git "$CORPUS_REF"
          git -C reference/corpus checkout --quiet --detach FETCH_HEAD

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          no-cache: true
          token: ""

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts --cache-dir "$RUNNER_TEMP/native-bun-cache"

      - name: Verify and run the native compatibility suite
        env:
          NATIVE_PLAN: ${{ needs.retrieve.outputs.plan }}
        run: bun scripts/native-suite.ts run

      - name: Step summary
        if: ${{ !cancelled() }}
        env:
          NATIVE_PLAN: ${{ needs.retrieve.outputs.plan }}
        run: |
          {
            echo '## native-suite'
            echo
            jq -r '.request | "- Implementation: `\(.implementation)`\n- Source SHA (caller-supplied): `\(.sourceSha // "unknown")`\n- Baseline: `\(.baseline)`\n- Mode: `\(.mode)`; limit: `\(.limit)`"' <<< "$NATIVE_PLAN"
            if [ -f out/native-suite/provenance.json ]; then
              jq -r '"- Verified binary SHA-256: `\(.binarySha256)`"' <<< "$NATIVE_PLAN"
            fi
            if [ -f out/native-suite/metrics.json ]; then
              echo
              echo 'See the artifact for the complete Markdown and HTML reports and per-case details.'
              echo
              echo '```json'
              jq '{selectedCases: .meta.selectedCases, verdictEligible: .meta.verdictEligible, executionFailures: (.meta.executionFailures | length), totals: (.totals | {cases, ran, skipped, fpTotal, missTotal, misanchorTotal, coverage}), comparison: {compatibility: .comparison.compatibility, strict: .comparison.strict}}' out/native-suite/metrics.json
              echo '```'
            else
              echo
              echo 'No metrics were produced. Check job status and any fallback report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports and provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ fromJSON(needs.retrieve.outputs.plan).request.implementation }}-${{ fromJSON(needs.retrieve.outputs.plan).request.baseline }}
          path: |
            out/native-suite/metrics.json
            out/native-suite/details.json
            out/native-suite/report.md
            out/native-suite/report.html
            out/native-suite/provenance.json
          if-no-files-found: ignore
          retention-days: 30
