# TS7 官方基线冒烟；使用兼容档回归门禁，严格一致及字段退步照常报告。
# 手动运行，包含原始诊断及 Markdown/HTML 产物。
name: ts7-official-baseline

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "只跑前 N 例（0 = 全部 28 例）"
        default: "0"
      adapter:
        description: "适配器（默认 tsc 自比；也可填 checker-batch 等已注册适配器）"
        default: "tsc-cli:node_modules/typescript-7-1/bin/tsc"

permissions:
  contents: read

jobs:
  official-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Resolve corpus ref（config/baselines.json）
        id: corpus
        run: |
          REF=$(bun -e 'const c = require("./config/baselines.json"); const b = c.baselines.find((x) => x.id === "7.1.0-beta-official"); if (!b) { console.error("unknown baseline 7.1.0-beta-official"); process.exit(1); } const corpus = c.corpora[b.corpus]; if (!corpus) { console.error("unknown corpus: " + b.corpus); process.exit(1); } console.log(corpus.ref)')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "corpus_ref=$REF"

      - name: Checkout TS7 corpus (${{ steps.corpus.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.corpus.outputs.ref }}
          path: reference/corpus-ts71

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run TS7 official-baseline smoke
        env:
          LIMIT: ${{ inputs.limit }}
          ADAPTER: ${{ inputs.adapter }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS+=(--limit "$LIMIT")
          else
            ARGS+=(--ratchet config/ratchet-ts71-official.tsv --gate)
          fi
          bun src/run.ts \
            --baseline 7.1.0-beta-official \
            --corpus reference/corpus-ts71/tsc/testdata/tests/cases \
            --adapter "$ADAPTER" \
            --expectation-source official-baseline \
            --mode official --option-strategy aligned \
            --cases config/smoke-cases-ts71-official.json \
            --out out --report-out out "${ARGS[@]}"

      - name: Generate report（失败兜底）
        if: always()
        run: mkdir -p out && bun src/report.ts --from out --md out/report.md --html out/report.html

      - name: Step summary
        if: always()
        env:
          CORPUS_REF: ${{ steps.corpus.outputs.ref }}
          ADAPTER: ${{ inputs.adapter }}
        run: |
          {
            echo "## TS7 official-baseline smoke"
            echo ""
            echo "- corpus: microsoft/TypeScript@${CORPUS_REF}"
            printf -- '- adapter: %s\n' "$ADAPTER"
            echo ""
            if [ -f out/report.md ]; then
              echo "完整报告见 artifact \`ts7-official-metrics\` 的 \`report.md\` / \`report.html\`。"
              echo ""
              cat out/report.md
            elif [ -f out/metrics.json ]; then
              echo '```json'
              jq '{gate: (.meta.gate | {passed, thresholds, checks}), totals: (.totals | {cases, ran, skipped, fpCases, fpTotal, coverage}), comparison: (.comparison | {compatibility, strict}), ratchet: (.meta.ratchet | if . == null then null else del(.regressionDetails) end)}' out/metrics.json 2>/dev/null || head -c 3000 out/metrics.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts7-official-metrics
          path: out/
          retention-days: 14
