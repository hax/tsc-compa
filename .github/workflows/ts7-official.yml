# TS7 官方基线冒烟：直接消费 TypeScript 7 官方仓库的 .errors.txt 基线，
# 跑 T0–T3 一致性分档并用 ratchet 清单门禁。
#
# 语料：microsoft/TypeScript（TS7 Go 布局），ref 从 config/baselines.json 的
# ts71-official corpus 现场解析（当前 aa814927；pin 对齐 #7 后自动跟随）。
# cases 在 tsc/testdata/tests/cases，基线在 tsc/testdata/baselines/reference。
#
# 只手动触发；不跑全量（全量留给后续批量/分片设施）。--gate 与 smoke.yml 的
# 7.1.0-beta-official 档同口径（ratchet 只记 T0–T2 门禁档、回落即红；T3 是
# 报告档，归一为 text，不判红）。
# 本 workflow 尚未在 GitHub Actions 上实际跑过：先手动 dispatch 跑绿一次，
# 再决定是否给它单独挂 cron；在它跑绿之前，smoke.yml 的每日 schedule 已覆盖
# 同一组 28 例官方基线冒烟。
name: ts7-official-baseline

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "只跑前 N 例（0 = 全部 28 例）"
        default: "0"
      adapter:
        description: "适配器（默认 tsc 自比；也可填 checker-batch 等已注册适配器）"
        default: "tsc-cli:node_modules/typescript-7-1/bin/tsc"

permissions:
  contents: read

jobs:
  official-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Resolve corpus ref（config/baselines.json）
        id: corpus
        run: |
          REF=$(bun -e 'const c = require("./config/baselines.json"); const b = c.baselines.find((x) => x.id === "7.1.0-beta-official"); if (!b) { console.error("unknown baseline 7.1.0-beta-official"); process.exit(1); } const corpus = c.corpora[b.corpus]; if (!corpus) { console.error("unknown corpus: " + b.corpus); process.exit(1); } console.log(corpus.ref)')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "corpus_ref=$REF"

      - name: Checkout TS7 corpus (${{ steps.corpus.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.corpus.outputs.ref }}
          path: reference/corpus-ts71

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run TS7 official-baseline smoke (T0-T3 + ratchet + gate)
        run: |
          LIMIT_ARGS=""
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            LIMIT_ARGS="--limit ${{ inputs.limit }}"
          fi
          bun src/run.ts \
            --baseline 7.1.0-beta-official \
            --corpus reference/corpus-ts71/tsc/testdata/tests/cases \
            --adapter "${{ inputs.adapter }}" \
            --expectation-source official-baseline \
            --mode official \
            --cases config/smoke-cases-ts71-official.json \
            --ratchet config/ratchet-ts71-official.tsv \
            --gate \
            $LIMIT_ARGS \
            --out out

      - name: Step summary
        if: always()
        env:
          CORPUS_REF: ${{ steps.corpus.outputs.ref }}
        run: |
          {
            echo "## TS7 official-baseline smoke"
            echo ""
            echo "- corpus: microsoft/TypeScript@${CORPUS_REF}"
            echo "- adapter: ${{ inputs.adapter }}"
            echo ""
            if [ -f out/metrics.json ]; then
              echo '```json'
              jq '{gate: (.meta.gate | {passed, thresholds, checks}), totals: (.totals | {cases, ran, skipped, fpCases, fpTotal, coverage, messageMismatch, byTier}), ratchet: .meta.ratchet}' out/metrics.json 2>/dev/null || head -c 3000 out/metrics.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts7-official-metrics
          path: out/
          retention-days: 14
