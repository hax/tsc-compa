# 单元测试 + 三档基线自比冒烟。
#
# 每个基线用 npm alias 装的 tsc 版本与它自己的语料 tag：
#   5.9.3      -> microsoft/TypeScript@v5.9.3
#   6.0.3      -> microsoft/TypeScript@b465fdbf…（strada）
#   7.1.0-beta -> microsoft/TypeScript@b465fdbf…（strada）
# 自比（期望源 = 实现）是 harness 正确性检查，不是兼容性结论。

name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test ./test

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: 5.9.3
            tsc: node_modules/typescript-5-9/bin/tsc
            corpus-ref: v5.9.3
          - baseline: 6.0.3
            tsc: node_modules/typescript-6-0/bin/tsc
            corpus-ref: b465fdbfe175304d9b977da137b2c178ae1091d3
          - baseline: 7.1.0-beta
            tsc: node_modules/typescript-7-1/bin/tsc
            corpus-ref: b465fdbfe175304d9b977da137b2c178ae1091d3
    steps:
      - uses: actions/checkout@v4
      - name: Checkout TypeScript corpus (${{ matrix.corpus-ref }})
        uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: ${{ matrix.corpus-ref }}
          path: reference/corpus
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Smoke — self-compare (${{ matrix.baseline }})
        run: >-
          bun src/run.ts
          --baseline ${{ matrix.baseline }}
          --corpus ${{ github.workspace }}/reference/corpus/tests/cases
          --adapter tsc-cli:${{ matrix.tsc }}
          --out .cache/run
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.baseline }}
          path: .cache/run/metrics.json
          retention-days: 7
