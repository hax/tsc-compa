name: TS version probes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official:
    name: Calibrate TS6 / TS7 probes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Assert both pinned TypeScript anchors
        run: bun run probes:versions
      - name: Publish summary
        if: always()
        run: |
          if [ -f .cache/version-probes/official/report.md ]; then
            cat .cache/version-probes/official/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-version-probes-official
          path: .cache/version-probes/official/
          if-no-files-found: ignore
          retention-days: 14
