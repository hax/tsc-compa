name: full-compatibility

on:
  # Exercise the full workflow when its own orchestration changes, not on ordinary PR updates.
  pull_request:
    paths:
      - .github/workflows/full-compatibility.yml
      - scripts/full-compatibility.ts
      - test/full-compatibility.test.ts
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards per checker (1–32)
        type: number
        default: 8
      reference:
        description: Reference source (live tsc costs more CPU)
        type: choice
        options: [official-baseline, tsc]
        default: official-baseline

permissions:
  contents: read

concurrency:
  group: full-compatibility-${{ github.event.pull_request.number || github.ref }}-${{ inputs.reference || 'official-baseline' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ref: ${{ steps.pin.outputs.ref }}
      repository: ${{ steps.pin.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Read pinned corpus
        id: pin
        run: |
          bun -e 'const c = require("./config/baselines.json"); const pin = c.corpora[c.baselines.find(b => b.id === "7.1.0-beta-official").corpus]; console.log(`ref=${pin.ref}\nrepository=${pin.repo}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: reference/corpus
          sparse-checkout: tsc/testdata/tests/cases
          persist-credentials: false
      - name: Plan and balance shards
        id: plan
        env:
          SHARDS: ${{ inputs.shards || 8 }}
          REFERENCE_SOURCE: ${{ inputs.reference || 'official-baseline' }}
        run: bun scripts/full-compatibility.ts plan reference/corpus/tsc/testdata/tests/cases shard-plan "$SHARDS" "$REFERENCE_SOURCE"
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-shard-plan
          path: shard-plan/
          if-no-files-found: error
          retention-days: 14

  evaluate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.candidate }} / ${{ matrix.shard }}
    env:
      CANDIDATE: ${{ matrix.candidate }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ needs.plan.outputs.ref }}
          path: reference/corpus
          sparse-checkout: |
            tsc/testdata/tests/cases
            tsc/testdata/baselines/reference
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-shard-plan
          path: shard-plan
      - run: bun install --frozen-lockfile
      - name: Evaluate shard
        run: |
          set -euo pipefail
          ARGS=()
          case "$CANDIDATE" in
            typescript) ;;
            bun-*) ARGS+=("$(command -v bun)") ;;
            tsrs)
              BIN=$(bun scripts/install-impl.ts --name tsrs --dest .cache/checkers | tail -n 1)
              test -x "$BIN"
              ARGS+=("$BIN") ;;
            *) exit 2 ;;
          esac
          bun scripts/full-compatibility.ts run shard-plan/plan.json "$SHARD" "$CANDIDATE" reference/corpus/tsc/testdata/tests/cases out "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.candidate }}-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  aggregate:
    needs: [plan, evaluate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-shard-plan
          path: shard-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: shard-results
      - name: Verify completeness and aggregate
        env:
          MATRIX_RESULT: ${{ needs.evaluate.result }}
        run: |
          status=0
          bun scripts/full-compatibility.ts merge shard-plan/plan.json shard-results summary || status=$?
          if [ "$MATRIX_RESULT" != success ]; then
            echo "Shard matrix: $MATRIX_RESULT" >&2
            exit 1
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-summary
          path: summary/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
