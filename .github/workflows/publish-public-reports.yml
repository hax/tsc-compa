name: Publish public reports to Pages

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: public-reports-pages
  cancel-in-progress: false

jobs:
  prepare:
    # Do not deploy site code selected from a feature branch or pull request.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out site code at the triggering default-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          sparse-checkout: site
          persist-credentials: false
      - name: Check out published report data
        uses: actions/checkout@v4
        with:
          ref: refs/heads/public-report-data
          path: data
          sparse-checkout: reports
          persist-credentials: false
      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          test -f source/site/index.html
          test ! -e source/site/reports
          test -f data/reports/catalog.json
          test -f data/reports/index.json
          if [ -n "$(find source/site data/reports -type l -print -quit)" ]; then
            echo '::error::Pages inputs may not contain symbolic links'
            exit 1
          fi
          mkdir _site
          cp -R source/site/. _site/
          cp -R data/reports _site/reports
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
